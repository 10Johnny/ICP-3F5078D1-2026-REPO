apiVersion: apps/v1
kind: Deployment
metadata:
  name: icp-devops-app
  namespace: icp-devops
  labels:
    app: icp-devops-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: icp-devops-app

  template:
    metadata:
      labels:
        app: icp-devops-app

    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: icp-devops-app
          image: icp-devops-app:1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: icp-devops-config

          env:
            - name: DEMO_SECRET
              valueFrom:
                secretKeyRef:
                  name: icp-devops-secret
                  key: DEMO_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
